schema_version: 1

context:
  name: atproto
  version: "0.0.72"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/atproto-${{ version }}.tar.gz
  sha256: eec904188b0beba165a7cc14ccc6a190b3ce061fecac4db3b9166e2500b02a41

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - atp = atproto_cli:atproto_cli
      - atproto = atproto_cli:atproto_cli

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core >=1.0.0
    - poetry-dynamic-versioning >=1.0.0,<2.0.0
    - pip
  run:
    - python >=${{ python_min }}
    - httpx >=0.25.0,<0.29.0
    - typing_extensions >=4.8.0,<5
    - click >=8.1.3,<9
    - websockets >=15,<18
    - pydantic >=2.7,<3
    - libipld >=3.0.1,<4
    - dnspython >=2.4.0,<3
    - cryptography >=41.0.7,<51
    - zstandard >=0.24.0,<0.26.0

tests:
  - python:
      imports:
        - atproto
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"
  - script:
      - atp --help
      - atproto --help

about:
  summary: The AT Protocol SDK
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/MarshalX/atproto

extra:
  recipe-maintainers:
    - akrherz
